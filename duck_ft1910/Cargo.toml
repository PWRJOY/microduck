[package]
name = "duck_ft1910"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FeeTech (SCS/HD-1910) RobotIo backend for MicroDuck"

[dependencies]
# 纯协议层 `wire` 只处理字节，不依赖任何外部 crate，因此在开发机上即可离线单测。
# `bus` 实现 duck-control 的 RobotIo 接缝：读路径复用官方 `SflpDecoder` 与 Sensors 类型，
# 不复制官方代码；串口用 serialport。
duck-control = { path = "../duck-control" }
# 与 duck-control / rustypot 保持同一大版本，且必须 default-features = false：
# 去掉只用于枚举端口的 libudev feature，否则 aarch64 板子上原生编译会因缺 sysroot 失败。
serialport = { version = "4.8", default-features = false }
# 飞特标定文件（关节方向/零位/PD/IMU 人格）由本 crate 自己读取，不改 robotd-params。
# 格式与 robotd.toml 同为 TOML（toml 版本也对齐 robotd）。
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = "0.9"
tracing.workspace = true
